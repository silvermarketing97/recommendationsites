<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480"><rect width="1000" height="480" rx="30" fill="#ffffff" stroke="#e3ebe7" stroke-width="2"/><text x="50" y="70" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#0b7f56">WHY SURVEYS SCREEN YOU OUT</text><text x="50" y="108" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#0b1f1a">What you can fix vs. what you can't</text><rect x="50" y="140" width="440" height="300" rx="22" fill="#fff6dc"/><text x="78" y="184" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#b37a00">Out of your control</text><rect x="510" y="140" width="440" height="300" rx="22" fill="#e9f8f1"/><text x="538" y="184" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#0f9d6b">In your control</text><circle cx="90" cy="220" r="13" fill="#e0a100"/><text x="90" y="225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">•</text><text x="116" y="226" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22302c">You are not the target audience</text><circle cx="90" cy="264" r="13" fill="#e0a100"/><text x="90" y="269" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">•</text><text x="116" y="270" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22302c">The quota is already full</text><circle cx="90" cy="308" r="13" fill="#e0a100"/><text x="90" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">•</text><text x="116" y="314" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22302c">You took a similar study recently</text><circle cx="90" cy="352" r="13" fill="#e0a100"/><text x="90" y="357" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight