# Recommendation Sites – admin panel configuration (Sveltia CMS)
# Panel URL: https://recommendationsites.com/admin/

backend:
  name: github
  repo: silvermarketing97/recommendationsites
  branch: main
  commit_messages:
    create: 'New article: {{slug}}'
    update: 'Edit: {{slug}}'
    delete: 'Delete: {{slug}}'
    uploadMedia: 'Upload: {{path}}'
    deleteMedia: 'Delete media: {{path}}'
site_url: https://recommendationsites.com
display_url: https://recommendationsites.com
logo_url: /assets/img/logo.svg
locale: en
media_folder: src/assets/uploads
public_folder: /assets/uploads
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: posts
  label: Articles
  label_singular: Article
  folder: src/posts
  create: true
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  sortable_fields:
  - date
  - title
  - category
  summary: '{{title}} — {{category}} — {{date | date(''YYYY-MM-DD'')}}'
  view_filters:
  - label: Swagbucks
    field: category
    pattern: swagbucks
  - label: Paid surveys
    field: category
    pattern: paid-surveys
  - label: Drafts
    field: draft
    pattern: true
  fields:
  - name: title
    label: Title (H1, ideally 50–65 characters)
    widget: string
  - name: description
    label: Meta description (140–160 characters, shown on Google)
    widget: text
  - name: date
    label: Publish date
    widget: datetime
    format: YYYY-MM-DDTHH:mm:ssZ
  - name: updated
    label: Last updated
    widget: datetime
    required: false
    format: YYYY-MM-DDTHH:mm:ssZ
  - name: category
    label: Category
    widget: select
    options:
    - label: Paid Surveys
      value: paid-surveys
    - label: Swagbucks
      value: swagbucks
    - label: Make Money Online
      value: make-money-online
    - label: Offline Side Hustles
      value: side-hustles
    - label: Money Tips
      value: money-tips
  - name: tags
    label: Tags
    widget: list
    required: false
    default: []
  - name: featured
    label: Featured on home page
    widget: boolean
    default: false
  - name: draft
    label: Draft (hidden from the site)
    widget: boolean
    default: false
  - name: image
    label: Cover image (upload or paste an Unsplash image URL)
    widget: image
    required: false
  - name: imageAlt
    label: Cover image description (alt text)
    widget: string
    required: false
  - name: imageCredit
    label: Photo credit (photographer name)
    widget: string
    required: false
  - name: imageCreditUrl
    label: Photographer profile URL
    widget: string
    required: false
  - name: videos
    label: YouTube videos (shown after the article)
    widget: list
    required: false
    fields:
    - name: id
      label: YouTube video ID (the part after watch?v=)
      widget: string
    - name: title
      label: Video title
      widget: string
    - name: channel
      label: Channel name
      widget: string
      required: false
  - name: faq
    label: FAQ (also sent to Google as structured data)
    widget: list
    required: false
    fields:
    - name: q
      label: Question
      widget: string
    - name: a
      label: Answer
      widget: text
  - name: body
    label: Article text
    widget: markdown
    required: false
  - name: blocks
    label: 🧱 Drag-and-drop blocks (optional – drag ☰ to reorder; shown after the text above)
    widget: list
    required: false
    collapsed: true
    types:
    - name: text
      label: 📝 Text
      widget: object
      fields:
      - name: title
        label: Heading (optional)
        widget: string
        required: false
      - name: body
        label: Text
        widget: markdown
      - name: background
        label: Background (home only)
        widget: select
        default: white
        options:
        - white
        - soft
        - dark
        required: false
      - name: align
        label: Alignment
        widget: select
        default: left
        options:
        - left
        - center
        required: false
      - name: width
        label: Width
        widget: select
        default: narrow
        options:
        - narrow
        - wide
        required: false
    - name: image
      label: 🖼️ Image
      widget: object
      fields:
      - name: src
        label: Image
        widget: image
      - name: alt
        label: Image description (alt text)
        widget: string
      - name: caption
        label: Caption
        widget: string
        required: false
      - name: credit
        label: Photo credit
        widget: string
        required: false
      - name: creditUrl
        label: Photo credit link
        widget: string
        required: false
      - name: link
        label: Link when clicked
        widget: string
        required: false
      - name: width
        label: Width
        widget: select
        default: narrow
        options:
        - narrow
        - wide
        required: false
    - name: video
      label: ▶️ YouTube video
      widget: object
      fields:
      - name: id
        label: YouTube video ID (after watch?v=)
        widget: string
      - name: title
        label: Video title
        widget: string
    - name: swagbucks
      label: ⭐ Swagbucks $5 bonus box
      widget: object
      fields:
      - name: headline
        label: Headline (optional)
        widget: string
        required: false
    - name: cta
      label: 🔘 Button / call to action
      widget: object
      fields:
      - name: title
        label: Title
        widget: string
        required: false
      - name: text
        label: Text
        widget: text
        required: false
      - name: buttonText
        label: Button text
        widget: string
      - name: url
        label: Button link (empty = your Swagbucks referral link)
        widget: string
        required: false
      - name: newTab
        label: Open in new tab
        widget: boolean
        default: false
        required: false
    - name: callout
      label: 💡 Tip / warning / summary box
      widget: object
      fields:
      - name: style
        label: Style
        widget: select
        default: tip
        options:
        - label: 💡 Pro tip (yellow)
          value: tip
        - label: ⚠️ Warning (red)
          value: warn
        - label: ✅ Key summary (green)
          value: key
      - name: body
        label: Text
        widget: markdown
    - name: faq
      label: ❓ FAQ
      widget: object
      fields:
      - name: title
        label: Title
        widget: string
        required: false
      - name: items
        label: Questions
        widget: list
        fields:
        - name: q
          label: Question
          widget: string
        - name: a
          label: Answer
          widget: text
    - name: html
      label: 🧩 HTML gadget / embed
      widget: object
      fields:
      - name: code
        label: HTML code (paste any ad, widget or embed code)
        widget: code
        default_language: html
        allow_language_selection: false
        output_code_only: true
        required: false
      - name: width
        label: Width (home only)
        widget: select
        default: narrow
        options:
        - narrow
        - wide
        - raw
        required: false
    - name: ad
      label: 📢 Advertisement
      widget: object
      fields:
      - name: format
        label: Ad format
        widget: select
        default: horizontal
        options:
        - label: Horizontal banner (728x90 / 970x90)
          value: horizontal
        - label: Rectangle (300x250 / 336x280)
          value: rectangle
        - label: Square (250x250)
          value: square
        - label: Vertical (300x600)
          value: vertical
      - name: mobile
        label: Show on mobile
        widget: boolean
        default: true
      - name: code
        label: HTML code (paste any ad, widget or embed code)
        widget: code
        default_language: html
        allow_language_selection: false
        output_code_only: true
        required: false
    - name: spacer
      label: ↕️ Spacer
      widget: object
      fields:
      - name: size
        label: Height in pixels
        widget: number
        default: 40
