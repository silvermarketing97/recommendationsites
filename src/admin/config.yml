# ============================================================
#  Recommendation Sites – admin panel configuration
#  Panel URL: https://recommendationsites.com/admin/
# ============================================================
backend:
  name: github
  repo: silvermarketing97/recommendationsites
  branch: main
  commit_messages:
    create: "New article: {{slug}}"
    update: "Edit: {{slug}}"
    delete: "Delete: {{slug}}"
    uploadMedia: "Upload: {{path}}"
    deleteMedia: "Delete media: {{path}}"

site_url: https://recommendationsites.com
display_url: https://recommendationsites.com
logo_url: /assets/img/logo.svg
locale: en

media_folder: src/assets/uploads
public_folder: /assets/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------- ARTICLES ----------------
  - name: posts
    label: Articles
    label_singular: Article
    folder: src/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [date, title, category]
    summary: "{{title}} — {{category}} — {{date | date('YYYY-MM-DD')}}"
    view_filters:
      - { label: Swagbucks, field: category, pattern: swagbucks }
      - { label: Paid surveys, field: category, pattern: paid-surveys }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: "Title (H1, ideally 50–65 characters)", widget: string }
      - { name: description, label: "Meta description (140–160 characters, shown on Google)", widget: text }
      - { name: date, label: Publish date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { name: updated, label: Last updated, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Paid Surveys, value: paid-surveys }
          - { label: Swagbucks, value: swagbucks }
          - { label: Make Money Online, value: make-money-online }
          - { label: Offline Side Hustles, value: side-hustles }
          - { label: Money Tips, value: money-tips }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: featured, label: "Featured on home page", widget: boolean, default: false }
      - { name: draft, label: "Draft (hidden from the site)", widget: boolean, default: false }
      - { name: image, label: "Cover image (upload or paste an Unsplash image URL)", widget: image, required: false }
      - { name: imageAlt, label: Cover image description (alt text), widget: string, required: false }
      - { name: imageCredit, label: Photo credit (photographer name), widget: string, required: false }
      - { name: imageCreditUrl, label: Photographer profile URL, widget: string, required: false }
      - name: videos
        label: YouTube videos (shown after the article)
        widget: list
        required: false
        fields:
          - { name: id, label: "YouTube video ID (the part after watch?v=)", widget: string }
          - { name: title, label: Video title, widget: string }
          - { name: channel, label: Channel name, widget: string, required: false }
      - name: faq
        label: FAQ (also sent to Google as structured data)
        widget: list
        required: false
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: body, label: Article text, widget: markdown }

  # ---------------- PAGES ----------------
  - name: pages
    label: Pages
    files:
      - { name: about, label: About, file: src/pages/about.md, fields: [ { name: title, label: Title, widget: string }, { name: description, label: Description, widget: text }, { name: permalink, label: URL, widget: hidden }, { name: body, label: Text, widget: markdown } ] }
      - { name: contact, label: Contact, file: src/pages/contact.md, fields: [ { name: title, label: Title, widget: string }, { name: description, label: Description, widget: text }, { name: permalink, label: URL, widget: hidden }, { name: body, label: Text, widget: markdown } ] }
      - { name: disclosure, label: Affiliate disclosure, file: src/pages/affiliate-disclosure.md, fields: [ { name: title, label: Title, widget: string }, { name: description, label: Description, widget: text }, { name: permalink, label: URL, widget: hidden }, { name: body, label: Text, widget: markdown } ] }
      - { name: privacy, label: Privacy policy, file: src/pages/privacy-policy.md, fields: [ { name: title, label: Title, widget: string }, { name: description, label: Description, widget: text }, { name: permalink, label: URL, widget: hidden }, { name: body, label: Text, widget: markdown } ] }
      - { name: terms, label: Terms of use, file: src/pages/terms.md, fields: [ { name: title, label: Title, widget: string }, { name: description, label: Description, widget: text }, { name: permalink, label: URL, widget: hidden }, { name: body, label: Text, widget: markdown } ] }

  # ---------------- SETTINGS ----------------
  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: General settings & referral link
        file: src/_data/site.json
        format: json
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: url, label: Site URL (no trailing slash), widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Default meta description, widget: text }
          - { name: language, label: Language code, widget: string, default: en }
          - { name: author, label: Author name shown on articles, widget: string }
          - { name: contactEmail, label: Contact email, widget: string }
          - { name: swagbucksUrl, label: "Swagbucks referral link (used everywhere on the site)", widget: string }
          - { name: swagbucksBonus, label: "Welcome bonus amount shown (e.g. $5)", widget: string }
          - { name: bonusNote, label: Bonus small print, widget: text }
          - { name: googleSiteVerification, label: "Google Search Console verification code (content=\"...\")", widget: string, required: false }
          - { name: googleAnalyticsId, label: "Google Analytics ID (G-XXXXXXX)", widget: string, required: false }
      - name: categories
        label: Categories
        file: src/_data/categories.json
        format: json
        fields:
          - name: categories
            label: Categories
            widget: list
            root: true
            fields:
              - { name: slug, label: "Slug (do not change after publishing)", widget: string }
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: icon, label: "Icon (survey, star, laptop, bag, coin)", widget: string }
