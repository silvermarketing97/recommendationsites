    label: Colors, fonts and bars
    file: src/_data/theme.json
    format: json
    fields:
    - name: colorDark
      label: Dark color (header bar
      footer: null
      boxes): null
      widget: color
    - name: colorBrand
      label: Brand color
      widget: color
    - name: colorBrandDark
      label: Brand color (darker
      links): null
      widget: color
    - name: colorAccent
      label: Button / highlight color
      widget: color
    - name: colorAccentDark
      label: Button color (darker)
      widget: color
    - name: colorSoft
      label: Soft background color
      widget: color
    - name: headingFont
      label: Heading font
      widget: select
      options:
      - Plus Jakarta Sans
      - Inter
      - Poppins
      - Montserrat
      - DM Sans
      - Outfit
      - Merriweather
      - Lora
      - Playfair Display
      - Roboto
    - name: bodyFont
      label: Text font
      widget: select
      options:
      - Inter
      - Plus Jakarta Sans
      - Poppins
      - Montserrat
      - DM Sans
      - Roboto
      - Open Sans
      - Lato
      - Merriweather
      - Lora
    - name: radius
      label: Corner roundness (px)
      widget: number
      default: 18
      value_type: int
    - name: showTopBar
      label: Show top announcement bar
      widget: boolean
    - name: topBarText
      label: Top bar text
      widget: string
    - name: topBarButton
      label: Top bar link text
      widget: string
    - name: showStickyMobileCta
      label: Show sticky bonus button on mobile
      widget: boolean
  - name: nav
    label: Main menu (drag ☰ to reorder)
    file: src/_data/nav.json
    format: json
    fields:
    - name: items
