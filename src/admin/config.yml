      label: Label shown above ads
      widget: string
      default: Advertisement
    - name: headCode
      label: Code inside <head> (e.g. Google AdSense auto-ads script, verification tags)
      widget: code
      default_language: html
      allow_language_selection: false
      output_code_only: true
      required: false
    - name: bodyEndCode
      label: Code at the end of every page (chat widgets, pixels, pop-unders)
      widget: code
      default_language: html
      allow_language_selection: false
      output_code_only: true
      required: false
    - name: adsTxt
