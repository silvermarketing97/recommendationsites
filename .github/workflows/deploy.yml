# Builds the site and uploads it to HostGator by FTP.
# Runs on every change (new article, edit from /admin, design update)
# and once a day so scheduled articles go live on their date.
name: Build & deploy to HostGator

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 11 * * *"   # daily 06:15 Bogotá
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to HostGator (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_DIR || './' }}
