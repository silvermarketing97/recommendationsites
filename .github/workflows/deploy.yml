# Builds the site and uploads it to HostGator by FTP.
# Runs on every change (new article, edit from /admin, design update)
# and once a day so scheduled articles go live on their date.
name: Build & deploy to HostGator

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 11 * * *"   # daily 06:15 Bogotá
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create admin login (from secrets)
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ADMIN2_USERNAME: ${{ secrets.ADMIN2_USERNAME }}
          ADMIN2_EMAIL: ${{ secrets.ADMIN2_EMAIL }}
          ADMIN2_PASSWORD: ${{ secrets.ADMIN2_PASSWORD }}
        run: php scripts/make-admin-config.php _site/admin/_private/config.php
      - name: Upload to HostGator (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_DIR || './' }}
      - name: WhatsApp notice for new articles (CallMeBot)
        if: github.event_name == 'push'
        env:
          WA_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WA_KEY: ${{ secrets.CALLMEBOT_APIKEY }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$WA_PHONE" ] || [ -z "$WA_KEY" ]; then echo "WhatsApp not configured, skipping"; exit 0; fi
          case "$MSG" in "New article:"*) ;; *) echo "Not a new article"; exit 0;; esac
          TITLE=$(printf '%s' "$MSG" | head -1 | sed 's/^New article: *//')
          for f in $(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'src/posts/*.md'); do
            SLUG=$(basename "$f" .md)
            TEXT=$(printf '✅ Nuevo artículo publicado en Recommendation Sites:\n\n%s\n\nhttps://recommendationsites.com/%s/' "$TITLE" "$SLUG")
            curl -s -G --max-time 30 "https://api.callmebot.com/whatsapp.php" \
              --data-urlencode "phone=$WA_PHONE" --data-urlencode "apikey=$WA_KEY" --data-urlencode "text=$TEXT" -o /dev/null -w "CallMeBot HTTP %{http_code}\n" || true
          done
